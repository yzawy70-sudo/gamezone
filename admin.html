<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GameZone | Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #070912;
    color: white;
    font-family: Tahoma, Arial, sans-serif;
}

header {
    height: 75px;
    padding: 0 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0b0f1b;
    border-bottom: 1px solid #252b3d;
}

.logo {
    font-size: 24px;
    font-weight: 900;
}

.logo span {
    color: #8b72ff;
}

.live {
    color: #35d399;
}

.container {
    width: 90%;
    max-width: 1250px;
    margin: 40px auto;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

.stat {
    padding: 23px;
    background: #0e1320;
    border: 1px solid #252b3d;
    border-radius: 18px;
}

.stat small {
    color: #8992a7;
}

.stat strong {
    display: block;
    margin-top: 10px;
    font-size: 35px;
}

.panel {
    margin-top: 25px;
    background: #0e1320;
    border: 1px solid #252b3d;
    border-radius: 18px;
    overflow: hidden;
}

.panel-header {
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #252b3d;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 11px 17px;
    color: white;
    background: #7657ff;
    cursor: pointer;
    font-weight: bold;
}

.danger {
    background: #b83250;
}

.orders {
    padding: 10px;
}

.order {
    padding: 20px;
    margin: 10px;
    border-radius: 15px;
    background: #111726;
    border: 1px solid #252d43;
}

.order-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.order-id {
    color: #8b72ff;
    font-weight: bold;
}

.email {
    margin-top: 10px;
    color: #d7dbea;
}

.info {
    margin-top: 7px;
    color: #8992a7;
}

.code {
    display: inline-block;
    margin-top: 12px;
    padding: 7px 10px;
    border-radius: 8px;
    background: #191f31;
    color: #a78bfa;
    font-family: monospace;
}

.status {
    display: inline-block;
    margin-top: 13px;
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
}

.status-new {
    background: #332c14;
    color: #facc15;
}

.status-processing {
    background: #182d45;
    color: #60a5fa;
}

.status-completed {
    background: #123326;
    color: #35d399;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.empty {
    padding: 60px;
    text-align: center;
    color: #8992a7;
}

@media(max-width:850px) {

    .stats {
        grid-template-columns: 1fr 1fr;
    }

}

@media(max-width:500px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .order-top {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
    Game<span>Zone</span> Admin
</div>

<div class="live">
    ● LIVE
</div>

</header>


<main class="container">

<div class="stats">

<div class="stat">
    <small>كل الطلبات</small>
    <strong id="total">0</strong>
</div>

<div class="stat">
    <small>جديدة</small>
    <strong id="newOrders">0</strong>
</div>

<div class="stat">
    <small>قيد المعالجة</small>
    <strong id="processing">0</strong>
</div>

<div class="stat">
    <small>مكتملة</small>
    <strong id="completed">0</strong>
</div>

</div>


<div class="panel">

<div class="panel-header">

<h2>
الطلبات المباشرة
</h2>

<div>

<button onclick="loadOrders()">
تحديث
</button>

<button class="danger" onclick="clearOrders()">
مسح
</button>

</div>

</div>


<div id="orders" class="orders">

<div class="empty">
في انتظار الطلبات...
</div>

</div>

</div>

</main>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let orders = [];


socket.on("connect", () => {

    console.log(
        "Admin connected:",
        socket.id
    );

});


socket.on("newOrder", order => {

    orders.unshift(order);

    render();

    notify();

});


socket.on("orderUpdated", updated => {

    const index =
        orders.findIndex(
            order =>
                order.id === updated.id
        );


    if (index !== -1) {

        orders[index] = updated;

    }

    render();

});


socket.on("ordersCleared", () => {

    orders = [];

    render();

});


async function loadOrders() {

    try {

        const response =
            await fetch("/api/orders");

        orders =
            await response.json();

        render();

    } catch (error) {

        console.error(error);

    }

}


function render() {

    updateStats();


    const container =
        document.getElementById("orders");


    if (!orders.length) {

        container.innerHTML =
            `<div class="empty">
                لا توجد طلبات حتى الآن.
            </div>`;

        return;
    }


    container.innerHTML =
        orders.map(order => {

            const status =
                order.status || "new";


            const statusText = {

                new: "جديد",

                processing:
                    "قيد المعالجة",

                completed:
                    "مكتمل"

            }[status] || status;


            const date =
                new Date(order.createdAt)
                .toLocaleString("ar-DZ");


            return `

            <div class="order">

                <div class="order-top">

                    <div>
                        <span class="order-id">
                            #${order.id}
                        </span>

                        <strong>
                            ${escapeHTML(order.game)}
                        </strong>
                    </div>

                    <span class="status status-${status}">
                        ${statusText}
                    </span>

                </div>


                <div class="email">
                    📧
                    ${escapeHTML(order.email)}
                </div>


                <div class="info">
                    💎
                    ${escapeHTML(order.packageName)}
                </div>


                <div class="code">
                    رمز التجربة:
                    ${escapeHTML(order.challengeCode)}
                </div>


                <div class="info">
                    🕒 ${date}
                </div>


                <div class="actions">

                    <button
                        onclick="changeStatus(${order.id}, 'processing')">
                        معالجة
                    </button>

                    <button
                        onclick="changeStatus(${order.id}, 'completed')">
                        مكتمل
                    </button>

                </div>

            </div>

            `;

        }).join("");

}


function updateStats() {

    document.getElementById("total")
        .textContent =
        orders.length;


    document.getElementById("newOrders")
        .textContent =
        orders.filter(
            o => (o.status || "new") === "new"
        ).length;


    document.getElementById("processing")
        .textContent =
        orders.filter(
            o => o.status === "processing"
        ).length;


    document.getElementById("completed")
        .textContent =
        orders.filter(
            o => o.status === "completed"
        ).length;

}


async function changeStatus(id, status) {

    await fetch(
        `/api/orders/${id}/status`,
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                status
            })
        }
    );

}


async function clearOrders() {

    if (!confirm(
        "هل تريد مسح جميع الطلبات؟"
    )) {
        return;
    }


    await fetch(
        "/api/orders",
        {
            method: "DELETE"
        }
    );

}


function notify() {

    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {

        new Notification(
            "GameZone",
            {
                body:
                    "وصل طلب جديد إلى لوحة الإدارة."
            }
        );

    }

}


function escapeHTML(value) {

    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


loadOrders();


// تحديث احتياطي كل 5 ثوانٍ
setInterval(loadOrders, 5000);

</script>

</body>

</html>
